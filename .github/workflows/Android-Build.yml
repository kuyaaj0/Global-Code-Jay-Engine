name: Android CI Build (Jay Engine APK)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4

    - name: Set up Java Development Kit (JDK 17)
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Android NDK (For C++ Math/Matrix)
      uses: android-actions/setup-android@v3

    - name: Generate Project Configuration Wrapper
      run: |
        cat << 'GRADLE' > build.gradle
        buildscript {
            repositories { google(); mavenCentral() }
            dependencies { classpath 'com.android.tools.build:gradle:8.1.1' }
        }
        allprojects { repositories { google(); mavenCentral() } }
        GRADLE
        
        echo "include ':GameTurboApp'" > settings.gradle
        
        gradle wrapper --gradle-version 8.1.1
        chmod +x gradlew

    - name: Assemble Mobile Debug APK
      run: |
        ./gradlew :GameTurboApp:assembleDebug --stacktrace

    - name: Upload Finished Testing Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Global-Code-Jay-Engine-Test-APK
        path: GameTurboApp/build/outputs/apk/debug/*.apk
